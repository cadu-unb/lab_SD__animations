<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relógio digital</title>
<style>
  :root{--bg:#14161a;--panel:#1d2026;--on:#4dff7a;--off:rgba(77,255,122,.07);--txt:#e6e6e6;--mut:#8a919c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
       background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,sans-serif;padding:16px}
  .tela{background:var(--panel);border:1px solid #2c313a;border-radius:16px;padding:28px 32px;
        box-shadow:0 12px 40px rgba(0,0,0,.45) inset,0 2px 0 #2c313a}
  .rel{display:flex;align-items:center;gap:clamp(6px,2vw,18px)}
  .dig{display:flex;gap:clamp(4px,1vw,10px)}
  svg.d{width:clamp(34px,9vw,84px);height:auto;display:block}
  svg.d path{fill:var(--off);transition:fill .08s}
  svg.d path.on{fill:var(--on);filter:drop-shadow(0 0 6px var(--on))}
  .sep{display:flex;flex-direction:column;gap:clamp(14px,4vw,34px)}
  .sep i{width:clamp(6px,1.4vw,12px);height:clamp(6px,1.4vw,12px);border-radius:50%;background:var(--on);
         box-shadow:0 0 8px var(--on);transition:opacity .1s}
  .sep.apagado i{opacity:.12;box-shadow:none}
  .info{text-align:center;color:var(--mut);font-size:14px;min-height:20px;font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{background:#2a2f38;color:var(--txt);border:1px solid #3a404b;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer}
  button:hover{background:#343a45}
  button[aria-pressed="true"]{border-color:var(--on);color:var(--on)}
  button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

<div class="tela" role="timer" aria-live="off" id="tela">
  <div class="rel" id="rel"></div>
</div>
<div class="info" id="info"></div>
<div class="bar">
  <button id="mRelogio" aria-pressed="true">Relógio</button>
  <button id="mCrono" aria-pressed="false">Cronômetro</button>
  <button id="go" disabled>▶ Iniciar</button>
  <button id="zera" disabled>↺ Zerar</button>
</div>

<script src="../../assets/js/relogio.js"></script>
</body>
</html>
