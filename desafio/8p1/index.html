<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semáforos – mini animação</title>
<style>
  body{margin:0;padding:16px;background:#1b1d21;color:#e6e6e6;font-family:system-ui,Segoe UI,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:10px}
  canvas{width:100%;max-width:1050px;aspect-ratio:21/12;border-radius:8px;background:#000}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
  button{background:#2f3540;color:#e6e6e6;border:1px solid #454c59;border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{background:#3a4150}
  #hud{font-variant-numeric:tabular-nums}
  .flags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .flag{display:flex;align-items:center;gap:8px;background:#262a31;border:1px solid #3a404b;border-radius:999px;
        padding:4px 12px 4px 8px;font-size:13px;min-width:120px}
  .flag i{width:14px;height:14px;border-radius:50%;background:#555;box-shadow:0 0 0 2px #111 inset}
  .flag b{font-weight:700}
  .flag small{opacity:.65;margin-left:auto}
  .flag.red i{background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
  .flag.yellow i{background:#ffd24d;box-shadow:0 0 8px #ffd24d}
  .flag.green i{background:#4dff7a;box-shadow:0 0 8px #4dff7a}
  .flag.off i{background:#555;box-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="pp">⏸ Pausar</button>
  <button id="rs">↺ Reiniciar</button>
  <label>Velocidade <input id="sp" type="range" min="0.5" max="4" step="0.5" value="1"> <span id="spv">1×</span></label>
  <span id="hud"></span>
</div>
<div id="flags" class="flags"></div>

<script src="../../assets/js/semaforos.js"></script>
</body>
</html>
