<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figura 4 – Cruzamento</title>
<!-- GERADO: o SVG abaixo é cópia de figura_04_cruzamento.svg (edite o .svg e regenere). -->
<style>
  body{margin:0;padding:16px;font-family:system-ui,Segoe UI,sans-serif;background:#f4f5f7;color:#111;
       display:flex;flex-direction:column;align-items:center;gap:12px}
  figure{margin:0;background:#fff;border:1px solid #c9cdd3;border-radius:8px;padding:8px;max-width:900px;width:100%}
  figure svg{width:100%;height:auto;display:block}
  figcaption{font-size:14px;padding:6px 8px 2px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
  select{font:inherit;padding:6px 10px;border:1px solid #888;border-radius:6px;background:#fff}
</style>
</head>
<body>
<figure>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" id="cruz"
     aria-labelledby="t4 d4" font-family="Segoe UI, Arial, sans-serif">
  <title id="t4">Cruzamento em vista superior</title>
  <desc id="d4">A via A segue do norte para o sul e a via B segue do leste para o oeste. Cada acesso tem um semáforo e um sensor antes da interseção. Estado ilustrativo: A verde, B vermelho.</desc>
  <style>
    .rua{fill:#d8dbe0;stroke:#222;stroke-width:2}
    .miolo{fill:#d8dbe0}
    .eixo{stroke:#fff;stroke-width:3;stroke-dasharray:14 10}
    .parada{stroke:#fff;stroke-width:6}
    .txt{fill:#111;font-size:15px}
    .tit{fill:#111;font-size:20px;font-weight:700;letter-spacing:2px}
    .peq{fill:#111;font-size:13px}
    .caixa{fill:#262626;stroke:#000;stroke-width:1.5}
    .lamp{fill:#5a5a5a;stroke:#000;stroke-width:1}
    .lamp.on{stroke:#fff;stroke-width:2.5}
    .lamp.on.r{fill:#ff3b30}.lamp.on.y{fill:#ffcc00}.lamp.on.g{fill:#2ecc71}
    .sensor{fill:url(#hach);stroke:#111;stroke-width:1.5}
    .guia{stroke:#111;stroke-width:1;fill:none}
    .la{stroke:#b3261e;stroke-width:5;fill:none}
    .lb{stroke:#1456a8;stroke-width:5;fill:none;stroke-dasharray:16 8}
    .fa{stroke:#b3261e;stroke-width:5;fill:none;marker-end:url(#pa)}
    .fb{stroke:#1456a8;stroke-width:5;fill:none;stroke-dasharray:16 8;marker-end:url(#pb)}
  </style>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
    <marker id="pb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1456a8"/></marker>
    <pattern id="hach" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fff"/><rect width="3" height="7" fill="#9aa1ab"/>
    </pattern>
  </defs>
  <rect width="760" height="530" fill="#fff"/>

  <!-- ruas -->
  <rect class="rua" x="320" y="44" width="120" height="460"/>
  <rect class="rua" x="100" y="210" width="560" height="120"/>
  <rect class="miolo" x="321" y="207" width="118" height="126"/>
  <rect class="miolo" x="317" y="212" width="126" height="116"/>
  <path class="eixo" d="M380 44V204M380 336V504M100 270H314M446 270H660"/>
  <path class="parada" d="M322 200H378M442 214V268"/>

  <!-- rótulos dos pontos cardeais -->
  <text class="tit" x="380" y="30" text-anchor="middle">NORTE</text>
  <text class="tit" x="380" y="524" text-anchor="middle">SUL</text>
  <text class="tit" x="6" y="276" text-anchor="start">OESTE</text>
  <text class="tit" x="754" y="276" text-anchor="end">LESTE</text>

  <!-- fluxos -->
  <path class="fa" d="M350 70V492"/>
  <path class="fb" d="M646 240H114"/>
  <text class="txt" x="360" y="102" font-weight="700" style="fill:#b3261e">A</text>
  <text class="txt" x="620" y="232" font-weight="700" style="fill:#1456a8">B</text>

  <!-- sensor A + semáforo A (acesso norte; mão direita = lado oeste) -->
  <rect class="sensor" x="322" y="164" width="56" height="26"/>
  <path class="guia" d="M292 180H322"/>
  <text class="txt" x="288" y="185" text-anchor="end" font-weight="700">Sensor A</text>

  <rect class="caixa" x="296" y="74" width="26" height="72" rx="5"/>
  <circle id="A-r" class="lamp r" cx="309" cy="90"  r="8"/>
  <circle id="A-y" class="lamp y" cx="309" cy="110" r="8"/>
  <circle id="A-g" class="lamp g on" cx="309" cy="130" r="8"/>
  <text class="txt" x="290" y="102" text-anchor="end" font-weight="700">Semáforo A</text>
  <text class="peq" x="290" y="120" text-anchor="end" id="A-estado">aceso: verde</text>

  <!-- sensor B + semáforo B (acesso leste; mão direita = lado norte) -->
  <rect class="sensor" x="470" y="212" width="26" height="56"/>
  <path class="guia" d="M483 212V200"/>
  <text class="txt" x="483" y="194" text-anchor="middle" font-weight="700">Sensor B</text>

  <rect class="caixa" x="520" y="168" width="72" height="26" rx="5"/>
  <circle id="B-r" class="lamp r on" cx="536" cy="181" r="8"/>
  <circle id="B-y" class="lamp y" cx="556" cy="181" r="8"/>
  <circle id="B-g" class="lamp g" cx="576" cy="181" r="8"/>
  <text class="txt" x="556" y="146" text-anchor="middle" font-weight="700">Semáforo B</text>
  <text class="peq" x="556" y="161" text-anchor="middle" id="B-estado">aceso: vermelho</text>

  <!-- legenda -->
  <g transform="translate(18,362)">
    <rect x="0" y="0" width="290" height="150" fill="#fff" stroke="#111" stroke-width="1.5" rx="6"/>
    <text class="txt" x="12" y="22" font-weight="700">Legenda</text>
    <path class="la" d="M14 40H58"/><text class="peq" x="68" y="45">via A: fluxo norte → sul</text>
    <path class="lb" d="M14 62H58"/><text class="peq" x="68" y="67">via B: fluxo leste → oeste</text>
    <rect class="sensor" x="14" y="76" width="44" height="14"/>
    <text class="peq" x="68" y="88">faixa de detecção do sensor</text>
    <text class="peq" x="12" y="110">sensorA / sensorB = 1 quando há</text>
    <text class="peq" x="12" y="125">veículo sobre a faixa da sua via.</text>
    <text class="peq" x="12" y="142" font-style="italic">Estado ilustrativo (um instante do ciclo).</text>
  </g>
</svg>

<figcaption><strong>Figura 4:</strong> Ilustração do cruzamento, mostrando a posição dos semáforos e dos sensores.</figcaption>
</figure>

<div class="bar">
  <label for="est">Estado ilustrativo:</label>
  <select id="est">
    <option value="vv">A verde · B vermelho</option>
    <option value="av">A amarelo · B vermelho</option>
    <option value="rr">A vermelho · B vermelho</option>
    <option value="rv">A vermelho · B verde</option>
    <option value="ra">A vermelho · B amarelo</option>
    <option value="pisca">Sistema desligado (amarelo intermitente)</option>
  </select>
</div>

<script>
/* cada estado: [A, B] com r|y|g|-  ('-' = tudo apagado) */
const ESTADOS = { vv:['g','r'], av:['y','r'], rr:['r','r'], rv:['r','g'], ra:['r','y'] };
const NOME = { r:'vermelho', y:'amarelo', g:'verde' };
const luz = (s, c) => document.getElementById(s + '-' + c);
let pisca = null;

function aplica(a, b){
  [['A', a], ['B', b]].forEach(([s, c]) => {
    ['r','y','g'].forEach(k => luz(s, k).classList.toggle('on', k === c));
    document.getElementById(s + '-estado').textContent = c === '-' ? 'apagado' : 'aceso: ' + NOME[c];
  });
}
document.getElementById('est').addEventListener('change', e => {
  clearInterval(pisca); pisca = null;
  if (e.target.value === 'pisca'){
    let on = true; aplica('y', 'y');
    pisca = setInterval(() => { on = !on; on ? aplica('y','y') : aplica('-','-'); }, 1000);   /* 1 s, como no enunciado */
  } else {
    const [a, b] = ESTADOS[e.target.value]; aplica(a, b);
  }
});
</script>
</body>
</html>
